<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Week 3 Day 1</title>

    <!-- Linking my css file -->
    <link rel="stylesheet" href="style.css">


    <!-- linking jQuery because I will use it for the functions -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <!-- QR code generator library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>


<body>

    <!-- creating the main profile card div -->
    <div class="profile-card">


        <!-- adding my profile picture -->
        <!-- adding a class so that I can style the image easily in css -->
        <img src="nayanpp.jpeg" alt="Nayan Profile Picture" class="profile-img">


        <!-- adding my name with h1 tag -->
        <h1>Nayan R Burlakoti</h1>


        <!-- adding my address -->
        <p class="address">Raniban, Kathmandu</p>


        <!-- creating a separate div for my other details -->
        <div class="details">

            <!-- adding my email -->
            <p>
                <strong>Email:</strong>
                nayan@example.com
            </p>

            <!-- adding my phone number -->
            <p>
                <strong>Phone:</strong>
                9768770214
            </p>

            <!-- adding my program -->
            <p>
                <strong>Program:</strong>
                BSc IT
            </p>

            <!-- adding my college -->
            <p>
                <strong>College:</strong>
                PGS
            </p>

        </div>


        <!-- creating a button for showing my QR code -->
        <!-- I will use this button in jQuery to open the QR popup -->
        <button id="qr" type="button">
            SHOW QR CODE
        </button>


        <!-- creating a div for the QR code popup -->
        <!-- this popup will be hidden first and will open when I click the QR button -->
        <div id="qrPopup" class="popup">


            <!-- creating the main content area inside the popup -->
            <div class="popup-content">


                <!-- creating a close button for the QR popup -->
                <!-- jQuery will be used to close the popup when I click this -->
                <span id="closePopup">&times;</span>


                <!-- adding heading for the QR popup -->
                <h2>My QR Code</h2>


                <!--
                    creating an empty div for the QR code.
                    The QR code generator will generate the code
                    inside this div using JavaScript.
                -->
                <div id="qrcode"></div>


                <!-- adding a small message below the QR code -->
                <p>Scan this QR code to view my profile.</p>

            </div>

        </div>

    </div>


    <!-- Linking my JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
